<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Rust Coach</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/vision.css">
  <script src="/static/vision.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body class="chat-page">
  <main class="workspace">
    <header class="chat-header">
      <span class="brand"><span class="brand-mark">R</span> RUST COACH</span>
      <button id="new-chat" type="button">新对话</button>
    </header>
    <div id="setup" class="setup" hidden>
      <strong>连接模型后即可开始</strong>
      <p>请在项目的 .env 中配置模型密钥，然后重启服务。</p>
    </div>
    <section id="scroll-area" class="scroll-area" aria-label="对话区域">
      <div id="welcome" class="welcome">
        <div class="eyebrow">RUST COACH</div>
        <h1>你的下一步，<br>一起算清楚。</h1>
        <p class="intro">告诉我你想做什么，或直接粘贴背包截图。<br>我会记住本次对话里的图片，帮你算材料、看基地、做选择。</p>
      </div>
      <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
    </section>
    <footer class="composer-area">
      <div id="error" class="error" role="alert" hidden></div>
      <form id="chat-form" class="composer">
        <div id="vision-pending" class="vision-pending" aria-label="待发送图片" hidden></div>
        <label class="sr-only" for="message-input">发送消息</label>
        <textarea id="message-input" name="message" rows="2" maxlength="6000" placeholder="问点什么，或粘贴一张截图…" disabled></textarea>
        <div class="composer-bottom">
          <button id="vision-add" class="attach-button" type="button" aria-label="添加图片" title="添加图片">＋</button>
          <input id="vision-files" class="sr-only" type="file" accept="image/png,image/jpeg,image/webp" multiple>
          <span id="send-status" class="composer-hint" aria-live="polite"></span>
          <button id="send" class="send-button" type="submit" aria-label="发送消息" disabled>↑</button>
        </div>
      </form>
      <p class="chat-hint">可粘贴或拖入图片 · Enter 发送，Shift + Enter 换行</p>
    </footer>
  </main>
</body>
</html>

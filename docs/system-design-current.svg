<text x="102" y="1101" font-size="18" font-weight="700" fill="#356493">D</text>
<text x="132" y="1101" font-size="21" font-weight="600" fill="#356493">L2 · 文本机制证据</text>
<text x="132" y="1129" font-size="18" font-weight="400" fill="#356493">官方更新 / Wiki / 攻略正文快照</text>

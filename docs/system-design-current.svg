<svg xmlns="http://www.w3.org/2000/svg" width="1984" height="1510" viewBox="0 0 1984 1510" role="img" aria-labelledby="title description">
<title id="title">Rust Coach · 六层技术架构</title>
<desc id="description">输入接入、理解路由、决策计算、生成审核构成从左向右的主链；知识层展示规则、证据、派生结果及检索和预计算位置；评测观测展示埋点、评测与 badcase 回流。D 蓝色表示确定性代码工具规则，G 紫色表示 LLM 或视觉模型，H 灰色表示人工复核。七条层间数据流无交叉；尚未实现的预计算、统一观测与发布闭环明确标为建议。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#7D8DA3" stroke-width="1.5"/></marker><marker id="feedback" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#A7803B" stroke-width="1.5"/></marker></defs>
<rect width="1984" height="1510" fill="#FFFFFF"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="64" y="64" font-size="36" font-weight="700" fill="#172B45">Rust Coach</text>
<text x="286" y="64" font-size="30" font-weight="500" fill="#42526A">六层技术架构</text>
<text x="64" y="106" font-size="22" font-weight="400" fill="#516176">以层为边界，保留关键职责与数据流；不展开节点内部的重试、缓存与存储实现。</text>

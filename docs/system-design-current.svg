<text x="102" y="1181" font-size="18" font-weight="700" fill="#356493">D</text>
<text x="132" y="1181" font-size="21" font-weight="600" fill="#356493">L3 · 派生结果</text>
<text x="132" y="1209" font-size="18" font-weight="400" fill="#356493">计算报告、算法版本及规则引用</text>
<rect x="560" y="994" width="856" height="72" rx="9" fill="#EDF4FC" stroke="none" stroke-width="1.5"/>
<text x="574" y="1021" font-size="18" font-weight="700" fill="#356493">D</text>
<text x="604" y="1021" font-size="21" font-weight="600" fill="#356493">实体查询 → 规则查表</text>
<text x="604" y="1049" font-size="18" font-weight="400" fill="#356493">物品 / 目标 ID + 条件 → L1 精确匹配 → 规则</text>
<rect x="560" y="1074" width="856" height="72" rx="9" fill="#EDF4FC" stroke="none" stroke-width="1.5"/>
<text x="574" y="1101" font-size="18" font-weight="700" fill="#356493">D</text>
<text x="604" y="1101" font-size="21" font-weight="600" fill="#356493">主题查询 → 搜索 → 正文读取</text>
<text x="604" y="1129" font-size="18" font-weight="400" fill="#356493">来源与相关性过滤 → L2 快照 → 引用匹配 → 证据</text>
<rect x="560" y="1154" width="856" height="72" rx="9" fill="#EDF4FC" stroke="none" stroke-width="1.5"/>
<text x="574" y="1181" font-size="18" font-weight="700" fill="#356493">D</text>
<text x="604" y="1181" font-size="21" font-weight="600" fill="#356493">规则 + 条件 → 上方计算引擎 → L3</text>
<text x="604" y="1209" font-size="18" font-weight="400" fill="#356493">动态推导：合成展开 / 阈值计算；LLM 只解释结果</text>

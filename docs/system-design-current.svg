<text x="580" y="194" font-size="20" font-weight="400" fill="#516176">流程编排 · 上下文与任务状态 · 有界执行</text>
<text x="1420" y="194" font-size="20" font-weight="400" fill="#516176">共享配置：规则 / 提示 / 校验策略</text>

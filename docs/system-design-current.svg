<text x="102" y="1021" font-size="18" font-weight="700" fill="#356493">D</text>
<text x="132" y="1021" font-size="21" font-weight="600" fill="#356493">L1 · 结构化规则</text>
<text x="132" y="1049" font-size="18" font-weight="400" fill="#356493">配方、伤害、适用条件与来源哈希</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="1410" viewBox="0 0 1820 1410" role="img" aria-labelledby="title desc">
<title id="title">Rust Coach：当前实现技术架构</title>
<desc id="desc">在线主链为输入、理解、决策、生成；知识提供规则和正文，评测观测支持人工回流。D 表示确定性代码，G 表示生成式模型，H 表示人工工程流程。路由由代码控制，计算按请求执行，预计算和自动回流尚未实现。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#788B9F"/></marker><marker id="feedback" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#A78339"/></marker></defs>

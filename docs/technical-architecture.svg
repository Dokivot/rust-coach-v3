<text x="95" y="373" font-size="17" fill="#295A82" font-weight="400">聊天 API：自由文本 / 显式命令</text>
<text x="95" y="396" font-size="17" fill="#295A82" font-weight="400">请求 ID、会话与输入 Schema</text>
<rect x="80" y="420" width="340" height="88" rx="10" fill="#EAF3FB" stroke="none"/>
<text x="93" y="448" font-size="19" fill="#295A82" font-weight="600">D</text>
<text x="124" y="448" font-size="21" fill="#295A82" font-weight="500">玩家状态</text>
<text x="95" y="473" font-size="17" fill="#295A82" font-weight="400">表单 API / 状态文本草稿确认</text>
<text x="95" y="496" font-size="17" fill="#295A82" font-weight="400">按服务器与清档范围存入档案</text>
<rect x="80" y="520" width="340" height="88" rx="10" fill="#EAF3FB" stroke="none"/>
<text x="93" y="548" font-size="19" fill="#295A82" font-weight="600">D</text>
<text x="124" y="548" font-size="21" fill="#295A82" font-weight="500">图片上传</text>
<text x="95" y="573" font-size="17" fill="#295A82" font-weight="400">解码校验、去 EXIF → 附件 ID</text>
<text x="95" y="596" font-size="17" fill="#295A82" font-weight="400">按会话归属读取图片</text>
<rect x="520" y="320" width="340" height="88" rx="10" fill="#F1EAF9" stroke="none"/>
<text x="533" y="348" font-size="19" fill="#70458F" font-weight="600">G</text>
<text x="564" y="348" font-size="21" fill="#70458F" font-weight="500">非结构化状态解析</text>
<text x="535" y="373" font-size="17" fill="#70458F" font-weight="400">VLM：截图 → 观测与任务类型</text>
<text x="535" y="396" font-size="17" fill="#70458F" font-weight="400">LLM：状态文本 → 待确认草稿</text>
<rect x="520" y="420" width="340" height="88" rx="10" fill="#EAF3FB" stroke="none"/>
<text x="533" y="448" font-size="19" fill="#295A82" font-weight="600">D</text>
<text x="564" y="448" font-size="21" fill="#295A82" font-weight="500">有效状态与上下文</text>
<text x="535" y="473" font-size="17" fill="#295A82" font-weight="400">scope / revision / TTL 状态投影</text>
<text x="535" y="496" font-size="17" fill="#295A82" font-weight="400">当前观测 + 历史 / 个人记忆</text>
<rect x="520" y="520" width="340" height="88" rx="10" fill="#EAF3FB" stroke="none"/>
<text x="533" y="548" font-size="19" fill="#295A82" font-weight="600">D</text>
<text x="564" y="548" font-size="21" fill="#295A82" font-weight="500">意图匹配与路由</text>
<text x="535" y="573" font-size="17" fill="#295A82" font-weight="400">命令 / 关键词 / 续问 / 视觉任务</text>
<text x="535" y="596" font-size="17" fill="#295A82" font-weight="400">分流计算、建议、聊天与展示</text>
<rect x="960" y="320" width="340" height="88" rx="10" fill="#F1EAF9" stroke="none"/>
<text x="973" y="348" font-size="19" fill="#70458F" font-weight="600">G</text>
<text x="1004" y="348" font-size="21" fill="#70458F" font-weight="500">分支解析与候选规划</text>
<text x="975" y="373" font-size="17" fill="#70458F" font-weight="400">计算分支：提取目标与参数</text>
<text x="975" y="396" font-size="17" fill="#70458F" font-weight="400">建议分支：候选行动与检索主题</text>
<rect x="960" y="420" width="340" height="88" rx="10" fill="#EAF3FB" stroke="none"/>
<text x="973" y="448" font-size="19" fill="#295A82" font-weight="600">D</text>
<text x="1004" y="448" font-size="21" fill="#295A82" font-weight="500">受控工具编排</text>
<text x="975" y="473" font-size="17" fill="#295A82" font-weight="400">Schema → 按需取证 → 候选评估</text>
<text x="975" y="496" font-size="17" fill="#295A82" font-weight="400">固定服务调用；预算与失败降级</text>
<rect x="960" y="520" width="340" height="88" rx="10" fill="#EAF3FB" stroke="none"/>
<text x="973" y="548" font-size="19" fill="#295A82" font-weight="600">D</text>
<text x="1004" y="548" font-size="21" fill="#295A82" font-weight="500">确定性计算引擎</text>
<text x="975" y="573" font-size="17" fill="#295A82" font-weight="400">配方 DAG / 拆除数量 / 材料缺口</text>
<text x="975" y="596" font-size="17" fill="#295A82" font-weight="400">独立候选预算；不扣减真实库存</text>
<rect x="1400" y="320" width="340" height="88" rx="10" fill="#EAF3FB" stroke="none"/>
<text x="1413" y="348" font-size="19" fill="#295A82" font-weight="600">D</text>
<text x="1444" y="348" font-size="21" fill="#295A82" font-weight="500">人设与表达约束</text>
<text x="1415" y="373" font-size="17" fill="#295A82" font-weight="400">教练原则 / 能力边界 / 用户偏好</text>
<text x="1415" y="396" font-size="17" fill="#295A82" font-weight="400">代码编译提示；数据不作指令</text>
<rect x="1400" y="420" width="340" height="88" rx="10" fill="#F1EAF9" stroke="none"/>
<text x="1413" y="448" font-size="19" fill="#70458F" font-weight="600">G</text>
<text x="1444" y="448" font-size="21" fill="#70458F" font-weight="500">条件推理与叙述</text>
<text x="1415" y="473" font-size="17" fill="#70458F" font-weight="400">依据工具结果与正文解释取舍</text>
<text x="1415" y="496" font-size="17" fill="#70458F" font-weight="400">普通聊天走独立上下文生成</text>
<rect x="1400" y="520" width="340" height="88" rx="10" fill="#EAF3FB" stroke="none"/>
<text x="1413" y="548" font-size="19" fill="#295A82" font-weight="600">D</text>
<text x="1444" y="548" font-size="21" fill="#295A82" font-weight="500">规则安全审核与组装</text>
<text x="1415" y="573" font-size="17" fill="#295A82" font-weight="400">数值 / 引文 / 虚假回执等检查</text>
<text x="1415" y="596" font-size="17" fill="#295A82" font-weight="400">保护事实块；有限修复或降级</text>
<text x="80" y="648" font-size="17" fill="#516176" font-weight="400">状态文本由 LLM 解析，经确认写入。</text>
<text x="80" y="677" font-size="17" fill="#516176" font-weight="400">截图先识别，普通文本直接准备上下文。</text>
<text x="520" y="648" font-size="17" fill="#516176" font-weight="400">自动截图用于当前任务，不自动入档。</text>
<text x="520" y="677" font-size="17" fill="#516176" font-weight="400">历史记忆 ≠ 当前库存；未知 ≠ 零。</text>
<text x="960" y="648" font-size="16" fill="#516176" font-weight="400">JSON / 已解析视觉参数跳过 LLM 解析。</text>
<text x="960" y="677" font-size="17" fill="#516176" font-weight="400">动态计算在此执行；没有预计算库。</text>
<text x="1400" y="648" font-size="17" fill="#516176" font-weight="400">纯计算 / 状态展示可直接模板组装。</text>
<text x="1400" y="677" font-size="17" fill="#516176" font-weight="400">返回回答，并保存完整成功轮次。</text>

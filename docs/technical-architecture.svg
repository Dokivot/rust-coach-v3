<text x="97" y="992" font-size="17" fill="#295A82" font-weight="400">配方 / 拆除规则 / 条件与来源哈希</text>
<text x="97" y="1015" font-size="17" fill="#295A82" font-weight="400">实体 ID 精确查表 → 决策层计算引擎</text>
<rect x="82" y="1040" width="420" height="88" rx="10" fill="#EAF3FB" stroke="none"/>
<text x="95" y="1068" font-size="19" fill="#295A82" font-weight="600">D</text>
<text x="126" y="1068" font-size="21" fill="#295A82" font-weight="500">L2 · 网页证据</text>
<text x="97" y="1093" font-size="17" fill="#295A82" font-weight="400">官方 / Wiki / 攻略正文快照</text>
<text x="97" y="1116" font-size="17" fill="#295A82" font-weight="400">来源、内容哈希、抓取时间与证据 ID</text>
<rect x="82" y="1141" width="420" height="88" rx="10" fill="#EAF3FB" stroke="none"/>
<text x="95" y="1169" font-size="19" fill="#295A82" font-weight="600">D</text>
<text x="126" y="1169" font-size="21" fill="#295A82" font-weight="500">L3 · 派生记录</text>
<text x="97" y="1194" font-size="17" fill="#295A82" font-weight="400">计算报告 + 算法版本 / 规则引用</text>
<text x="97" y="1217" font-size="17" fill="#295A82" font-weight="400">随成功轮次存档，不是预计算索引</text>
<rect x="526" y="939" width="770" height="88" rx="10" fill="#EAF3FB" stroke="none"/>
<text x="539" y="967" font-size="19" fill="#295A82" font-weight="600">D</text>
<text x="570" y="967" font-size="21" fill="#295A82" font-weight="500">检索链路</text>
<text x="541" y="992" font-size="17" fill="#295A82" font-weight="400">主题 → 缓存命中；未命中 → Tavily 搜索 / 已登记页面</text>
<text x="541" y="1015" font-size="17" fill="#295A82" font-weight="400">白名单正文抓取 → 相关性过滤 → 快照 → 返回原文证据</text>
<rect x="526" y="1040" width="770" height="88" rx="10" fill="#EAF3FB" stroke="none"/>
<text x="539" y="1068" font-size="19" fill="#295A82" font-weight="600">D</text>
<text x="570" y="1068" font-size="21" fill="#295A82" font-weight="500">推导与留存</text>
<text x="541" y="1093" font-size="17" fill="#295A82" font-weight="400">规则 + 合法参数 + 有效状态 → 决策层引擎 → 计算报告</text>
<text x="541" y="1116" font-size="17" fill="#295A82" font-weight="400">报告在回答组装后保存；LLM 读取结果，不产生配方或伤害规则</text>
<rect x="526" y="1141" width="770" height="88" rx="10" fill="#FAF7EF" stroke="none"/>
<text x="542" y="1170" font-size="21" fill="#89641E" font-weight="500">当前边界</text>
<text x="542" y="1196" font-size="18" fill="#89641E" font-weight="400">无向量检索、预计算结果库或自动规则更新。</text>
<text x="542" y="1220" font-size="18" fill="#89641E" font-weight="400">固定规则快照与网页证据均未核验当前游戏 build。</text>
